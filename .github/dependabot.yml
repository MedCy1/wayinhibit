version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      cargo-updates:
        update-types: ["patch", "minor"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    ignore:
      - dependency-name: dtolnay/rust-toolchain
    groups:
      actions-updates:
        update-types: ["patch", "minor"]
