name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  coverage:
    name: Code coverage
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Cache Cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Install sway
        run: sudo apt-get install -y sway

      - name: Generate coverage (unit + Wayland integration tests)
        run: |
          source <(cargo llvm-cov show-env --export-prefix)
          cargo build --locked
          cargo test --locked
          ./scripts/e2e-test.sh
          cargo llvm-cov report --lcov --output-path lcov.info

      - name: Upload to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  deny:
    name: Dependency audit
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Run cargo-deny
        uses: EmbarkStudios/cargo-deny-action@v2

  rust:
    name: Rust Checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --check

      - name: Check compilation
        run: cargo check --locked

      - name: Run tests
        run: cargo test --locked

      - name: Run Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

  msrv:
    name: Minimum supported Rust version
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Rust 1.85
        uses: dtolnay/rust-toolchain@1.85

      - name: Cache Cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check compilation on MSRV
        run: cargo check --locked

  namcap:
    name: Validate PKGBUILD
    runs-on: ubuntu-latest
    container: archlinux:base-devel

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install namcap
        run: pacman -Sy --noconfirm namcap

      - name: Run namcap on PKGBUILD
        run: namcap packaging/PKGBUILD
