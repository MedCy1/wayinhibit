name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  rust:
    name: Rust Checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --check

      - name: Check compilation
        run: cargo check --locked

      - name: Run tests
        run: cargo test --locked

      - name: Run Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

  integration-test:
    name: Wayland integration test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install sway
        run: sudo apt-get install -y sway

      - name: Build
        run: cargo build --locked

      - name: Run Wayland integration tests
        env:
          WLR_BACKENDS: headless
          WLR_RENDERER: pixman
          WLR_LIBINPUT_NO_DEVICES: "1"
        run: |
          export XDG_RUNTIME_DIR=$(mktemp -d)
          sway -c /dev/null 2>/dev/null &
          SWAY_PID=$!
          trap "kill $SWAY_PID 2>/dev/null || true" EXIT

          for i in $(seq 1 20); do
            SOCKET=$(find "$XDG_RUNTIME_DIR" -name 'wayland-*' ! -name '*.lock' 2>/dev/null | head -1)
            [ -n "$SOCKET" ] && break
            sleep 0.5
          done
          [ -n "$SOCKET" ] || { echo "error: sway failed to start"; exit 1; }

          export WAYLAND_DISPLAY=$(basename "$SOCKET")

          ./target/debug/wayinhibit --quiet --timeout 1s
          echo "ok: foreground mode with timeout"

          ./target/debug/wayinhibit --quiet --timeout 5s -- true
          echo "ok: child command mode"

          ./target/debug/wayinhibit --quiet --timeout 5s -- sh -c 'exit 42' && STATUS=0 || STATUS=$?
          [ $STATUS -eq 42 ] || { echo "error: expected exit code 42, got $STATUS"; exit 1; }
          echo "ok: child exit code is propagated"

  namcap:
    name: Validate PKGBUILD
    runs-on: ubuntu-latest
    container: archlinux:base-devel

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install namcap
        run: pacman -Sy --noconfirm namcap

      - name: Run namcap on PKGBUILD
        run: namcap packaging/PKGBUILD
