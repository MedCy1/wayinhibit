name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.2.0)'
        required: true

jobs:
  verify:
    name: Check that the tag matches the project version
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Compare the tag with Cargo.toml
        env:
          # An environment variable, never interpolated into the script.
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          case "$TAG" in
            v[0-9]*) ;;
            *) echo "error: '$TAG' is not a release tag like v1.2.3" >&2; exit 1 ;;
          esac
          if [ -z "$version" ] || [ "${TAG#v}" != "$version" ]; then
            echo "error: tag '$TAG' does not match version '$version' in Cargo.toml" >&2
            echo "Nothing was built or published." >&2
            exit 1
          fi

  build:
    name: Build (${{ matrix.target }})
    needs: verify
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64
          - runner: ubuntu-24.04-arm
            target: aarch64

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build release binary
        run: cargo build --release --locked

      - name: Upload binary artifact
        uses: actions/upload-artifact@v7
        with:
          name: wayinhibit-${{ matrix.target }}
          path: target/release/wayinhibit
          retention-days: 1

  smoke-test-x86_64:
    name: Smoke test (Arch Linux, x86_64)
    needs: build
    runs-on: ubuntu-latest
    container: archlinux:base

    steps:
      - name: Download binary artifact
        uses: actions/download-artifact@v8
        with:
          name: wayinhibit-x86_64

      - name: Make binary executable
        run: chmod +x wayinhibit

      - name: Check version output
        run: |
          version=$(./wayinhibit --version)
          echo "Reported version: $version"
          [ -n "$version" ]

      - name: Check help output
        run: ./wayinhibit --help

  smoke-test-aarch64:
    name: Smoke test (ARM64, aarch64)
    needs: build
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Download binary artifact
        uses: actions/download-artifact@v8
        with:
          name: wayinhibit-aarch64

      - name: Make binary executable
        run: chmod +x wayinhibit

      - name: Check version output
        run: |
          version=$(./wayinhibit --version)
          echo "Reported version: $version"
          [ -n "$version" ]

      - name: Check help output
        run: ./wayinhibit --help

  release:
    name: Publish GitHub release
    needs: [smoke-test-x86_64, smoke-test-aarch64]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Generate release notes
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --latest --strip header
        env:
          OUTPUT: notes.md
          GITHUB_REPO: ${{ github.repository }}

      - name: Download x86_64 artifact
        uses: actions/download-artifact@v8
        with:
          name: wayinhibit-x86_64
          path: x86_64

      - name: Download aarch64 artifact
        uses: actions/download-artifact@v8
        with:
          name: wayinhibit-aarch64
          path: aarch64

      - name: Rename binaries for release
        run: |
          mv x86_64/wayinhibit wayinhibit-x86_64
          mv aarch64/wayinhibit wayinhibit-aarch64

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          body_path: notes.md
          files: |
            wayinhibit-x86_64
            wayinhibit-aarch64

  publish-crate:
    name: Publish to crates.io
    needs: release
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Publish to crates.io
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
