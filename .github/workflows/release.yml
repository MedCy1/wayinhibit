name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.2.0)'
        required: true

jobs:
  build:
    name: Build release binary
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build release binary
        run: cargo build --release --locked

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: wayinhibit-x86_64
          path: target/release/wayinhibit
          retention-days: 1

  smoke-test:
    name: Smoke test on Arch Linux
    needs: build
    runs-on: ubuntu-latest
    container: archlinux:base

    steps:
      - name: Download binary artifact
        uses: actions/download-artifact@v4
        with:
          name: wayinhibit-x86_64

      - name: Make binary executable
        run: chmod +x wayinhibit

      - name: Check version output
        run: |
          version=$(./wayinhibit --version)
          echo "Reported version: $version"
          [ -n "$version" ]

      - name: Check help output
        run: ./wayinhibit --help

  release:
    name: Publish GitHub release
    needs: smoke-test
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download binary artifact
        uses: actions/download-artifact@v4
        with:
          name: wayinhibit-x86_64

      - name: Rename binary for release
        run: mv wayinhibit wayinhibit-x86_64

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          files: wayinhibit-x86_64
