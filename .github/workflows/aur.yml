name: Update AUR

on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to update AUR for (e.g. v0.4.0)'
        required: true

jobs:
  aur:
    name: Update AUR package
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && startsWith(github.event.workflow_run.head_branch, 'v')) }}
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Set up SSH for AUR
        env:
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%b\n' "$AUR_SSH_KEY" > ~/.ssh/aur
          chmod 600 ~/.ssh/aur
          printf 'Host aur.archlinux.org\n  IdentityFile ~/.ssh/aur\n  User aur\n  StrictHostKeyChecking no\n' >> ~/.ssh/config

      - name: Compute checksums
        id: sums
        run: |
          TAG="${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.workflow_run.head_branch }}"
          VERSION="${TAG#v}"
          printf 'version=%s\n' "$VERSION" >> "$GITHUB_OUTPUT"

          BINARY_SHA_X86_64=$(curl -fsSL \
            "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/wayinhibit-x86_64" \
            | sha256sum | cut -d' ' -f1)
          printf 'binary_sha_x86_64=%s\n' "$BINARY_SHA_X86_64" >> "$GITHUB_OUTPUT"

          BINARY_SHA_AARCH64=$(curl -fsSL \
            "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/wayinhibit-aarch64" \
            | sha256sum | cut -d' ' -f1)
          printf 'binary_sha_aarch64=%s\n' "$BINARY_SHA_AARCH64" >> "$GITHUB_OUTPUT"

          LICENSE_SHA=$(curl -fsSL \
            "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$TAG/LICENSE" \
            | sha256sum | cut -d' ' -f1)
          printf 'license_sha=%s\n' "$LICENSE_SHA" >> "$GITHUB_OUTPUT"

          BASH_SHA=$(curl -fsSL \
            "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$TAG/completions/wayinhibit.bash" \
            | sha256sum | cut -d' ' -f1)
          printf 'bash_sha=%s\n' "$BASH_SHA" >> "$GITHUB_OUTPUT"

          ZSH_SHA=$(curl -fsSL \
            "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$TAG/completions/_wayinhibit" \
            | sha256sum | cut -d' ' -f1)
          printf 'zsh_sha=%s\n' "$ZSH_SHA" >> "$GITHUB_OUTPUT"

          FISH_SHA=$(curl -fsSL \
            "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$TAG/completions/wayinhibit.fish" \
            | sha256sum | cut -d' ' -f1)
          printf 'fish_sha=%s\n' "$FISH_SHA" >> "$GITHUB_OUTPUT"

          MAN_SHA=$(curl -fsSL \
            "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$TAG/man/wayinhibit.1" \
            | sha256sum | cut -d' ' -f1)
          printf 'man_sha=%s\n' "$MAN_SHA" >> "$GITHUB_OUTPUT"

      - name: Update PKGBUILD and .SRCINFO
        env:
          VERSION: ${{ steps.sums.outputs.version }}
          BINARY_SHA_X86_64: ${{ steps.sums.outputs.binary_sha_x86_64 }}
          BINARY_SHA_AARCH64: ${{ steps.sums.outputs.binary_sha_aarch64 }}
          LICENSE_SHA: ${{ steps.sums.outputs.license_sha }}
          BASH_SHA: ${{ steps.sums.outputs.bash_sha }}
          ZSH_SHA: ${{ steps.sums.outputs.zsh_sha }}
          FISH_SHA: ${{ steps.sums.outputs.fish_sha }}
          MAN_SHA: ${{ steps.sums.outputs.man_sha }}
          REPO: ${{ github.repository }}
        run: |
          python3 - << 'EOF'
          import os, re

          version = os.environ['VERSION']
          binary_sha_x86_64 = os.environ['BINARY_SHA_X86_64']
          binary_sha_aarch64 = os.environ['BINARY_SHA_AARCH64']
          license_sha = os.environ['LICENSE_SHA']
          bash_sha = os.environ['BASH_SHA']
          zsh_sha = os.environ['ZSH_SHA']
          fish_sha = os.environ['FISH_SHA']
          man_sha = os.environ['MAN_SHA']
          repo = os.environ['REPO']

          # Update PKGBUILD
          content = open('packaging/PKGBUILD').read()
          content = re.sub(r'^pkgver=.*', f'pkgver={version}', content, flags=re.M)
          content = re.sub(r'^pkgrel=.*', 'pkgrel=1', content, flags=re.M)
          content = re.sub(
              r"sha256sums=\(.*?\)",
              f"sha256sums=(\n    '{license_sha}'\n    '{bash_sha}'\n    '{zsh_sha}'\n    '{fish_sha}'\n    '{man_sha}'\n)",
              content, flags=re.DOTALL,
          )
          content = re.sub(
              r"sha256sums_x86_64=\(.*?\)",
              f"sha256sums_x86_64=(\n    '{binary_sha_x86_64}'\n)",
              content, flags=re.DOTALL,
          )
          content = re.sub(
              r"sha256sums_aarch64=\(.*?\)",
              f"sha256sums_aarch64=(\n    '{binary_sha_aarch64}'\n)",
              content, flags=re.DOTALL,
          )
          open('packaging/PKGBUILD', 'w').write(content)

          # Generate .SRCINFO
          srcinfo = (
              f"pkgbase = wayinhibit\n"
              f"\tpkgdesc = A small Wayland idle inhibitor written in Rust\n"
              f"\tpkgver = {version}\n"
              f"\tpkgrel = 1\n"
              f"\turl = https://github.com/{repo}\n"
              f"\tarch = x86_64\n"
              f"\tarch = aarch64\n"
              f"\tlicense = MIT\n"
              f"\tdepends = glibc\n"
              f"\tdepends = gcc-libs\n"
              f"\tsource = LICENSE::https://raw.githubusercontent.com/{repo}/v{version}/LICENSE\n"
              f"\tsource = wayinhibit.bash::https://raw.githubusercontent.com/{repo}/v{version}/completions/wayinhibit.bash\n"
              f"\tsource = _wayinhibit::https://raw.githubusercontent.com/{repo}/v{version}/completions/_wayinhibit\n"
              f"\tsource = wayinhibit.fish::https://raw.githubusercontent.com/{repo}/v{version}/completions/wayinhibit.fish\n"
              f"\tsource = wayinhibit.1::https://raw.githubusercontent.com/{repo}/v{version}/man/wayinhibit.1\n"
              f"\tsha256sums = {license_sha}\n"
              f"\tsha256sums = {bash_sha}\n"
              f"\tsha256sums = {zsh_sha}\n"
              f"\tsha256sums = {fish_sha}\n"
              f"\tsha256sums = {man_sha}\n"
              f"\tsource_x86_64 = wayinhibit-{version}::https://github.com/{repo}/releases/download/v{version}/wayinhibit-x86_64\n"
              f"\tsha256sums_x86_64 = {binary_sha_x86_64}\n"
              f"\tsource_aarch64 = wayinhibit-{version}::https://github.com/{repo}/releases/download/v{version}/wayinhibit-aarch64\n"
              f"\tsha256sums_aarch64 = {binary_sha_aarch64}\n"
              f"\n"
              f"pkgname = wayinhibit\n"
          )
          open('packaging/.SRCINFO', 'w').write(srcinfo)
          EOF

      - name: Commit updated packaging files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add packaging/
          git diff --cached --quiet || git commit -m "chore: update AUR packaging for v${{ steps.sums.outputs.version }}"
          git diff --quiet HEAD origin/main || git push

      - name: Clone AUR repository
        run: git clone ssh://aur@aur.archlinux.org/wayinhibit.git /tmp/aur

      - name: Push to AUR
        run: |
          cp packaging/PKGBUILD /tmp/aur/PKGBUILD
          cp packaging/.SRCINFO /tmp/aur/.SRCINFO
          cd /tmp/aur
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add PKGBUILD .SRCINFO
          git commit -m "Update to ${{ steps.sums.outputs.version }}"
          git push
