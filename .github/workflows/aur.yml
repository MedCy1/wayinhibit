name: Update AUR

on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to update AUR for (e.g. v0.4.0)'
        required: true

jobs:
  aur:
    name: Update AUR package
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && startsWith(github.event.workflow_run.head_branch, 'v')) }}
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Set up SSH for AUR
        env:
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%b\n' "$AUR_SSH_KEY" > ~/.ssh/aur
          chmod 600 ~/.ssh/aur
          # The host key is pinned (its fingerprint, SHA256:RFzBCUItH9LZS0cKB5UE6ceAYhBD5C8GeOBip8Z11+4,
          # is the one published on the Arch wiki), so a man in the middle cannot receive the push.
          printf '%s\n' 'aur.archlinux.org ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEuBKrPzbawxA/k2g6NcyV5jmqwJ2s+zpgZGZ7tpLIcN' > ~/.ssh/known_hosts
          printf 'Host aur.archlinux.org\n  IdentityFile ~/.ssh/aur\n  User aur\n  StrictHostKeyChecking yes\n' >> ~/.ssh/config

      - name: Compute checksums
        id: sums
        shell: bash
        env:
          # Passed as environment variables, never interpolated into the script: the tag is
          # user input when the workflow is started by hand.
          DISPATCH_TAG: ${{ inputs.tag }}
          RUN_TAG: ${{ github.event.workflow_run.head_branch }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = workflow_dispatch ]; then TAG="$DISPATCH_TAG"; else TAG="$RUN_TAG"; fi
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "error: '$TAG' is not a release tag like v1.2.3" >&2
            exit 1
          fi
          VERSION="${TAG#v}"
          printf 'version=%s\n' "$VERSION" >> "$GITHUB_OUTPUT"

          # Downloads to a file first: hashing a pipe would give the checksum of an empty
          # input when curl fails, and that checksum would end up in the package.
          checksum() {
            local file="$RUNNER_TEMP/asset"
            rm -f "$file"
            # set -e does not reach into a command substitution, so failures are explicit.
            curl -fsSL --retry 3 --output "$file" "$1" || { echo "error: download failed: $1" >&2; exit 1; }
            [ -s "$file" ] || { echo "error: empty download from $1" >&2; exit 1; }
            sha256sum "$file" | cut -d' ' -f1
          }

          TARBALL_SHA=$(checksum "https://github.com/$GITHUB_REPOSITORY/archive/refs/tags/$TAG.tar.gz")
          printf 'tarball_sha=%s\n' "$TARBALL_SHA" >> "$GITHUB_OUTPUT"

          BINARY_SHA_X86_64=$(checksum "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/wayinhibit-x86_64")
          printf 'binary_sha_x86_64=%s\n' "$BINARY_SHA_X86_64" >> "$GITHUB_OUTPUT"

          BINARY_SHA_AARCH64=$(checksum "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/wayinhibit-aarch64")
          printf 'binary_sha_aarch64=%s\n' "$BINARY_SHA_AARCH64" >> "$GITHUB_OUTPUT"

      - name: Update PKGBUILD and .SRCINFO
        env:
          VERSION: ${{ steps.sums.outputs.version }}
          TARBALL_SHA: ${{ steps.sums.outputs.tarball_sha }}
          BINARY_SHA_X86_64: ${{ steps.sums.outputs.binary_sha_x86_64 }}
          BINARY_SHA_AARCH64: ${{ steps.sums.outputs.binary_sha_aarch64 }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - << 'EOF'
          import os, re

          version = os.environ['VERSION']
          tarball_sha = os.environ['TARBALL_SHA']
          binary_sha_x86_64 = os.environ['BINARY_SHA_X86_64']
          binary_sha_aarch64 = os.environ['BINARY_SHA_AARCH64']
          repo = os.environ['REPO']

          for name, value in [('tarball', tarball_sha), ('x86_64', binary_sha_x86_64), ('aarch64', binary_sha_aarch64)]:
              if not re.fullmatch(r'[0-9a-f]{64}', value):
                  raise SystemExit(f'error: the {name} checksum is not a sha256: {value!r}')

          def substitute(pattern, replacement, text, flags=0):
              # A pattern that matches nothing would leave an old checksum in place and ship it.
              text, count = re.subn(pattern, replacement, text, flags=flags)
              if count != 1:
                  raise SystemExit(f'error: expected exactly one match for {pattern!r}, found {count}')
              return text

          # Update PKGBUILD
          content = open('packaging/PKGBUILD').read()
          content = substitute(r'^pkgver=.*', f'pkgver={version}', content, re.M)
          content = substitute(r'^pkgrel=.*', 'pkgrel=1', content, re.M)
          content = substitute(r"sha256sums=\(.*?\)", f"sha256sums=(\n    '{tarball_sha}'\n)", content, re.DOTALL)
          content = substitute(r"sha256sums_x86_64=\(.*?\)", f"sha256sums_x86_64=(\n    '{binary_sha_x86_64}'\n)", content, re.DOTALL)
          content = substitute(r"sha256sums_aarch64=\(.*?\)", f"sha256sums_aarch64=(\n    '{binary_sha_aarch64}'\n)", content, re.DOTALL)
          open('packaging/PKGBUILD', 'w').write(content)

          # Generate .SRCINFO
          srcinfo = (
              f"pkgbase = wayinhibit\n"
              f"\tpkgdesc = A small Wayland idle inhibitor written in Rust\n"
              f"\tpkgver = {version}\n"
              f"\tpkgrel = 1\n"
              f"\turl = https://github.com/{repo}\n"
              f"\tarch = x86_64\n"
              f"\tarch = aarch64\n"
              f"\tlicense = MIT\n"
              f"\tdepends = glibc\n"
              f"\tdepends = gcc-libs\n"
              f"\tsource = wayinhibit-{version}.tar.gz::https://github.com/{repo}/archive/refs/tags/v{version}.tar.gz\n"
              f"\tsha256sums = {tarball_sha}\n"
              f"\tsource_x86_64 = wayinhibit-{version}-bin::https://github.com/{repo}/releases/download/v{version}/wayinhibit-x86_64\n"
              f"\tsha256sums_x86_64 = {binary_sha_x86_64}\n"
              f"\tsource_aarch64 = wayinhibit-{version}-bin::https://github.com/{repo}/releases/download/v{version}/wayinhibit-aarch64\n"
              f"\tsha256sums_aarch64 = {binary_sha_aarch64}\n"
              f"\n"
              f"pkgname = wayinhibit\n"
          )
          open('packaging/.SRCINFO', 'w').write(srcinfo)
          EOF

      - name: Commit updated packaging files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add packaging/
          git diff --cached --quiet || git commit -m "chore: update AUR packaging for v${{ steps.sums.outputs.version }}"
          git diff --quiet HEAD origin/main || git push

      - name: Clone AUR repository
        run: git clone ssh://aur@aur.archlinux.org/wayinhibit.git /tmp/aur

      - name: Push to AUR
        run: |
          cp packaging/PKGBUILD /tmp/aur/PKGBUILD
          cp packaging/.SRCINFO /tmp/aur/.SRCINFO
          cd /tmp/aur
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add PKGBUILD .SRCINFO
          git commit -m "Update to ${{ steps.sums.outputs.version }}"
          git push
